# Second Look behind nginx (127.0.0.1:8040). Real mode needs ENSAYO_REAL=1 and MODEL_API_KEY in .env (env_file).
services:
  ensayo:
    build: .
    container_name: ensayo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8040:8040"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./results:/app/results
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8040/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
