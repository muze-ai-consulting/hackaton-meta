[project]
name = "ensayo"
version = "0.1.0"
description = "Audiencias sintéticas que prueban anuncios de Instagram y Facebook antes de pagarlos."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ensayo"]

[tool.ruff]
line-length = 120
